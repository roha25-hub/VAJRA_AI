services:
  - type: web
    name: vajra-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_TO
        sync: false
      - key: ELEVENLABS_KEY
        sync: false
      - key: ELEVENLABS_VOICE
        value: Rachel
      - key: AEGIS_RUN_MODE
        value: live
      - key: AEGIS_CACHE_PATH
        value: llm/cache.sqlite
      - key: AEGIS_TRACE_DIR
        value: data/traces
      - key: PYTHON_VERSION
        value: "3.11.9"
